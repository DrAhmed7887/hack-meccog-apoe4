name: test

on:
  push:
  pull_request:

jobs:
  make-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Offline unit tests only (standard library). No keys, no network, no pipeline run.
      - run: make test
